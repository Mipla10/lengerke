<!doctype html>
<!--
  Plantilla de og-image.png (1200x630). Se renderiza con Chromium headless:
    python3 -m http.server 8765            (desde la raíz del proyecto)
    chromium --headless=new --window-size=1200,630 --hide-scrollbars \
      --screenshot=og-image.png http://127.0.0.1:8765/scripts/og-image.html
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0e1013; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f3f5f7; position: relative; }
  .glow { position: absolute; inset: 0; background:
    radial-gradient(700px 420px at 92% 20%, rgba(76,201,240,.16), transparent 70%),
    radial-gradient(600px 400px at 70% 95%, rgba(255,106,61,.18), transparent 70%); }
  .text { position: absolute; left: 64px; top: 54px; width: 680px; }
  .kicker { color: #ff6a3d; font-weight: 800; font-size: 22px; letter-spacing: .1em; text-transform: uppercase; }
  h1 { font-size: 64px; line-height: 1.0; margin: 16px 0 0; font-weight: 850; letter-spacing: -.025em; }
  .route { margin-top: 20px; font-size: 23px; color: #b8c0ca; line-height: 1.4; }
  .stats { position: absolute; left: 64px; bottom: 140px; display: flex; gap: 44px; }
  .stats b { display: block; font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 20px; color: #9ba4af; }
  svg { position: absolute; }
  #plan { right: 24px; top: 24px; }
  #prof { left: 0; bottom: 0; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="text">
  <div class="kicker">Santander, Colombia · 5 días</div>
  <h1>Expedición<br>Caminos de Lengerke</h1>
  <div class="route">Los Santos → Jordán → Villanueva →<br>Barichara → Guane → Zapatoca</div>
</div>
<div class="stats" id="stats"></div>
<svg id="plan" width="430" height="430"></svg>
<svg id="prof" width="1200" height="120"></svg>
<script>
const COLORS = { 1: "#ff6a3d", 2: "#ffc53d", 4: "#4cc9f0" };
const nf = (n, d = 0) => n.toLocaleString("es-CO", { minimumFractionDigits: d, maximumFractionDigits: d });
fetch("../data/route.json").then(r => r.json()).then(R => {
  const walk = R.days.filter(d => d.track);
  const s = R.summary;
  document.getElementById("stats").innerHTML =
    [[nf(s.walk_km, 1) + " km", "caminando"], ["+" + nf(s.gain_m) + " m", "desnivel"], [s.nights + " noches", `${s.camping_nights} camping · ${s.hotel_nights} hotel`]]
      .map(([b, t]) => `<div><b>${b}</b><span>${t}</span></div>`).join("");

  // Ruta en planta (equirectangular, suficiente a esta escala)
  const all = walk.flatMap(d => d.track);
  const k = Math.cos(6.7 * Math.PI / 180);
  const xs = all.map(t => t[0] * k), ys = all.map(t => t[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const W = 430, H = 430, pad = 40, sc = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (y1 - y0));
  const ox = (W - (x1 - x0) * sc) / 2, oy = (H - (y1 - y0) * sc) / 2;
  const P = (lon, lat) => [ox + (lon * k - x0) * sc, H - (oy + (lat - y0) * sc)];
  let g = "";
  for (const d of walk) {
    const pts = d.track.map(t => P(t[0], t[1]).map(v => v.toFixed(1)).join(",")).join(" ");
    g += `<polyline points="${pts}" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
          <polyline points="${pts}" fill="none" stroke="${COLORS[d.day]}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  for (const p of R.places) {
    const [x, y] = P(p.lon, p.lat);
    const big = ["Los Santos", "Barichara", "Zapatoca", "Jordán", "Puente Ruedas"].includes(p.name);
    g += `<circle cx="${x}" cy="${y}" r="${big ? 8 : 5}" fill="#fff" stroke="#0e1013" stroke-width="3"/>`;
    if (big) {
      const right = ["Zapatoca", "Puente Ruedas"].includes(p.name);
      g += `<text x="${x + (right ? 14 : -14)}" y="${y + 7}" text-anchor="${right ? "start" : "end"}" fill="#f3f5f7" font-size="20" font-weight="700" paint-order="stroke" stroke="#0e1013" stroke-width="5">${p.name}</text>`;
    }
  }
  document.getElementById("plan").innerHTML = g;

  // Perfil de todo el viaje
  const total = walk.reduce((a, d) => a + d.distance_km, 0);
  const lo = Math.min(...walk.map(d => d.min_ele_m)), hi = Math.max(...walk.map(d => d.max_ele_m));
  const X = x => x / total * 1200, Y = e => 118 - (e - lo) / (hi - lo) * 100;
  let off = 0, pg = "";
  for (const d of walk) {
    const pts = d.profile.map(([k, e]) => `${X(off + k).toFixed(1)},${Y(e).toFixed(1)}`).join(" ");
    pg += `<polygon points="${X(off)},120 ${pts} ${X(off + d.distance_km)},120" fill="${COLORS[d.day]}" fill-opacity=".28"/>
           <polyline points="${pts}" fill="none" stroke="${COLORS[d.day]}" stroke-width="3"/>`;
    off += d.distance_km;
  }
  document.getElementById("prof").innerHTML = pg;
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
